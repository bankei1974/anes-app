<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anesthesiologist OR Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght @AppData\Local\Google\Chrome\User Data\Profile 2\Code Cache\js\15b400a4c0a2ca27_0;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        .editable-input {
            background-color: transparent;
            border: 1px solid transparent;
            transition: all 0.2s ease-in-out;
            width: 100%;
            border-radius: 0.375rem; /* rounded-md */
        }
        .editable-input:focus {
            background-color: white;
            border-color: #3b82f6; /* blue-500 */
            outline: none;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4);
        }
        .editable-input[readonly] {
            cursor: not-allowed;
            padding-left: 0;
        }
        .anesthesiologist-input { 
            font-size: 0.875rem; /* text-sm */
            font-weight: 600; /* font-semibold */
            color: #1f2937; /* gray-800 */
        }
        .anesthesiologist-input::placeholder { color: #9ca3af; /* gray-400 */ }
        
        .crna-resident-input { 
            font-size: 0.875rem; /* text-sm */
            color: #4b5563; /* gray-600 */
        }
        .crna-resident-input::placeholder { color: #9ca3af; /* gray-400 */ }

        .role-input { 
            font-size: 1rem; /* text-base */
            font-weight: 600; /* font-semibold */
        }
        .role-input[readonly] { background-color: transparent; }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }

        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="h-full">
    <!-- Login Modal -->
    <div id="login-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 fade-in">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <h3 class="text-lg leading-6 font-medium text-gray-900">Admin Login</h3>
                <div class="mt-2 px-7 py-3">
                    <input type="password" id="password-input" class="w-full px-3 py-2 text-gray-700 border rounded-lg focus:outline-none" placeholder="Enter PIN" autocomplete="off" />
                    <p id="error-message" class="text-red-500 text-sm mt-2 h-4"></p>
                </div>
                <div class="items-center px-4 py-3">
                    <button id="login-button" class="px-4 py-2 bg-blue-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-300">
                        Log In
                    </button>
                     <button id="cancel-login-button" class="mt-2 px-4 py-2 bg-gray-200 text-gray-800 text-base font-medium rounded-md w-full shadow-sm hover:bg-gray-300 focus:outline-none">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Anesthesiologist Login Modal -->
    <div id="anesthesiologist-login-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 fade-in">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <h3 class="text-lg leading-6 font-medium text-gray-900">Anesthesiologist Login</h3>
                <div class="mt-2 px-7 py-3 space-y-3">
                    <input type="email" id="anes-email-input" class="w-full px-3 py-2 text-gray-700 border rounded-lg focus:outline-none" placeholder="Email" autocomplete="email" />
                    <input type="password" id="anes-password-input" class="w-full px-3 py-2 text-gray-700 border rounded-lg focus:outline-none" placeholder="Password" autocomplete="current-password" />
                    <p id="anes-error-message" class="text-red-500 text-sm mt-2 h-4"></p>
                </div>
                <div class="items-center px-4 py-3">
                    <button id="anes-login-button" class="px-4 py-2 bg-blue-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-300">
                        Log In
                    </button>
                     <button id="anes-cancel-login-button" class="mt-2 px-4 py-2 bg-gray-200 text-gray-800 text-base font-medium rounded-md w-full shadow-sm hover:bg-gray-300 focus:outline-none">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="flex flex-col h-full bg-gray-50">
        <!-- Header -->
        <header class="bg-white shadow-sm sticky top-0 z-20">
            <div class="max-w-full mx-auto px-4 sm:px-6 lg:px-8 py-2 flex justify-between items-center">
                <div>
                    <h1 class="text-lg font-bold text-gray-800 tracking-tight">Anesthesiology Board</h1>
                </div>
                <div class="flex items-center">
                    <span id="user-display" class="hidden text-sm font-medium text-gray-700 mr-4"></span>
                    <div id="guest-view">
                        <button id="show-anes-login-button" class="px-3 py-1.5 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Provider Login</button>
                        <button id="show-admin-login-button" class="ml-2 px-3 py-1.5 bg-gray-700 text-white text-sm font-medium rounded-md hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500">Admin</button>
                    </div>
                    <div id="logged-in-view" class="hidden items-center">
                        <a id="profile-link" href="./profile.html" class="hidden text-sm font-medium text-blue-600 hover:text-blue-800 mr-4">My Profile</a>
                        <a id="admin-panel-link" href="./admin.html" class="hidden text-sm font-medium text-blue-600 hover:text-blue-800 mr-4">Admin Panel</a>
                        <button id="logout-button" class="px-3 py-1.5 bg-red-500 text-white text-sm font-medium rounded-md hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">Log Out</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-2 sm:p-3 lg:p-4">
            <div id="loading-indicator" class="flex justify-center items-center h-full">
                <div class="text-center">
                    <div class="loader mx-auto"></div>
                    <p class="mt-2 text-gray-600">Connecting to live board...</p>
                </div>
            </div>

            <div id="app-content" class="hidden max-w-full mx-auto space-y-4">
                <!-- Top Bar Section -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <!-- Daily Assignments -->
                    <div class="bg-white rounded-lg shadow-sm p-3">
                        <h2 class="text-base font-semibold text-gray-700 mb-2">Daily Assignments</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label for="charge-input" class="block text-xs font-medium text-gray-500">Charge</label>
                                <input type="text" id="charge-input" placeholder="Assign..." class="editable-input role-input w-full rounded-md placeholder-gray-400">
                            </div>
                            <div>
                                <label for="float-input" class="block text-xs font-medium text-gray-500">Float</label>
                                <input type="text" id="float-input" placeholder="Assign..." class="editable-input role-input w-full rounded-md placeholder-gray-400">
                            </div>
                        </div>
                    </div>
                    <!-- Active Assignments -->
                    <div class="bg-white rounded-lg shadow-sm p-3">
                        <h2 class="text-base font-semibold text-gray-700 mb-2">Current Assignments</h2>
                        <div id="active-list" class="min-h-[2.5rem] flex flex-wrap gap-2 items-center">
                            <!-- Active list will be populated here -->
                        </div>
                    </div>
                </div>

                <!-- OR Board -->
                <div>
                    <h2 class="text-base font-semibold text-gray-700 mb-2">Operating Rooms</h2>
                    <ul id="or-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-2">
                        <!-- OR items will be dynamically inserted here -->
                    </ul>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, getDocs, getDoc, updateDoc, writeBatch, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Configuration ---
        const firebaseConfig = {
          apiKey: "AIzaSyDN9q5wMyNpIg1Mbil-zSowNwAlrJPIzOg",
          authDomain: "anes-app.firebaseapp.com",
          projectId: "anes-app",
          storageBucket: "anes-app.firebasestorage.app",
          messagingSenderId: "53351553251",
          appId: "1:53351553251:web:956b092846ffa331760dd6",
          measurementId: "G-0PRB28VZ2C"
        };
        const appId = firebaseConfig.appId;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- DOM Elements ---
        const appContent = document.getElementById('app-content');
        const orList = document.getElementById('or-list');
        const loadingIndicator = document.getElementById('loading-indicator');
        const activeList = document.getElementById('active-list');
        
        const adminLoginModal = document.getElementById('login-modal');
        const passwordInput = document.getElementById('password-input');
        const adminLoginButton = document.getElementById('login-button');
        const cancelAdminLoginButton = document.getElementById('cancel-login-button');
        const showAdminLoginButton = document.getElementById('show-admin-login-button');
        const adminErrorMessage = document.getElementById('error-message');

        const anesLoginModal = document.getElementById('anesthesiologist-login-modal');
        const anesEmailInput = document.getElementById('anes-email-input');
        const anesPasswordInput = document.getElementById('anes-password-input');
        const anesLoginButton = document.getElementById('anes-login-button');
        const anesCancelLoginButton = document.getElementById('anes-cancel-login-button');
        const showAnesLoginButton = document.getElementById('show-anes-login-button');
        const anesErrorMessage = document.getElementById('anes-error-message');

        const userDisplay = document.getElementById('user-display');
        const guestView = document.getElementById('guest-view');
        const loggedInView = document.getElementById('logged-in-view');
        const logoutButton = document.getElementById('logout-button');
        const adminPanelLink = document.getElementById('admin-panel-link');
        const profileLink = document.getElementById('profile-link');

        const chargeInput = document.getElementById('charge-input');
        const floatInput = document.getElementById('float-input');

        // --- State ---
        let isAdmin = false;
        const ADMIN_PIN = "1234"; 
        let usersCache = {};
        let currentUserProfile = null;

        // --- Main Application Logic ---
        onAuthStateChanged(auth, async (user) => {
            isAdmin = sessionStorage.getItem('isAdmin') === 'true';

            await loadUserProfiles();

            if (user) {
                currentUserProfile = usersCache[user.uid] || null;
                const orRoomsCollectionRef = collection(db, `artifacts/${appId}/public/data/or_rooms`);
                const dailyRolesDocRef = doc(db, `artifacts/${appId}/public/data/daily_assignments`, 'roles');

                await Promise.all([
                    seedInitialData(orRoomsCollectionRef),
                    setupDailyRoles(dailyRolesDocRef)
                ]);
                
                listenForUpdates(orRoomsCollectionRef);
                listenForRoles(dailyRolesDocRef);
                updateUIMode(user); 
            } else {
                isAdmin = false;
                sessionStorage.removeItem('isAdmin');
                currentUserProfile = null;
                updateUIMode(null);
            }
        });
        
        async function authenticateUser() {
            try {
                if (!auth.currentUser) {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Authentication Error:", error);
                loadingIndicator.innerHTML = '<p class="text-red-500">Authentication failed. Please refresh.</p>';
            }
        }

        async function loadUserProfiles() {
            const usersCollection = collection(db, 'users');
            const snapshot = await getDocs(usersCollection);
            usersCache = {};
            snapshot.forEach(doc => {
                usersCache[doc.id] = doc.data();
            });
        }

        // --- Database Functions (seedInitialData, setupDailyRoles, listenForRoles are unchanged) ---
        async function seedInitialData(collectionRef) {
            const snapshot = await getDocs(collectionRef);
            if (snapshot.empty) {
                console.log("Seeding initial data...");
                const batch = writeBatch(db);
                const defaultRooms = [
                    { roomName: "OR 1", anesthesiologist: "", crnaResident: "", order: 1 },
                    { roomName: "OR 2", anesthesiologist: "", crnaResident: "", order: 2 },
                    { roomName: "OR 3", anesthesiologist: "", crnaResident: "", order: 3 },
                    { roomName: "OR 4", anesthesiologist: "", crnaResident: "", order: 4 },
                    { roomName: "OR 5", anesthesiologist: "", crnaResident: "", order: 5 },
                    { roomName: "OR 6", anesthesiologist: "", crnaResident: "", order: 6 },
                    { roomName: "OR 7", anesthesiologist: "", crnaResident: "", order: 7 },
                    { roomName: "IR", anesthesiologist: "", crnaResident: "", order: 8 },
                    { roomName: "OR 10", anesthesiologist: "", crnaResident: "", order: 9 },
                    { roomName: "OR 11", anesthesiologist: "", crnaResident: "", order: 10 },
                    { roomName: "OR 12", anesthesiologist: "", crnaResident: "", order: 11 },
                    { roomName: "OR 13", anesthesiologist: "", crnaResident: "", order: 12 },
                    { roomName: "OR 14", anesthesiologist: "", crnaResident: "", order: 13 },
                    { roomName: "OR 15", anesthesiologist: "", crnaResident: "", order: 14 },
                    { roomName: "OR 16", anesthesiologist: "", crnaResident: "", order: 15 },
                    { roomName: "OR 17", anesthesiologist: "", crnaResident: "", order: 16 },
                    { roomName: "OR 18", anesthesiologist: "", crnaResident: "", order: 17 },
                    { roomName: "Imaging", anesthesiologist: "", crnaResident: "", order: 18 },
                ];
                defaultRooms.forEach(room => {
                    batch.set(doc(collectionRef), room);
                });
                await batch.commit();
            }
        }

        async function setupDailyRoles(docRef) {
            const docSnap = await getDoc(docRef);
            if (!docSnap.exists()) {
                await setDoc(docRef, { charge: "", float: "" });
            }
        }

        function listenForUpdates(collectionRef) {
            onSnapshot(collectionRef, (snapshot) => {
                const rooms = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                rooms.sort((a, b) => a.order - b.order);
                renderORBoard(rooms);
                renderActiveAssignments(rooms);
                loadingIndicator.classList.add('hidden');
                appContent.classList.remove('hidden');
            }, (error) => {
                console.error("Error fetching room data:", error);
                loadingIndicator.innerHTML = '<p class="text-red-500">Error connecting to the live board.</p>';
            });
        }

        function listenForRoles(docRef) {
            onSnapshot(docRef, (doc) => {
                if (doc.exists()) {
                    const roles = doc.data();
                    chargeInput.value = roles.charge || "";
                    floatInput.value = roles.float || "";
                }
            }, (error) => {
                console.error("Error fetching roles data:", error);
            });
        }

        // --- UI Rendering ---
        function renderORBoard(rooms) {
            orList.innerHTML = ''; 
            if (rooms.length === 0) return;

            const user = auth.currentUser;
            const isProviderLoggedIn = user && !user.isAnonymous;

            const commIcons = {
                call: '<svg class="w-3 h-3 ml-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>',
                text: '<svg class="w-3 h-3 ml-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>',
                pager: '<svg class="w-3 h-3 ml-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 4a2 2 0 012-2h6a2 2 0 012 2v12a2 2 0 01-2 2H7a2 2 0 01-2-2V4zm3 0h4v2H8V4z"></path></svg>'
            };

            rooms.forEach(room => {
                const li = document.createElement('li');
                li.className = 'bg-white rounded-lg shadow-sm p-2 flex flex-col justify-between transition hover:shadow-md fade-in';
                
                const anesUid = room.anesthesiologist;
                const isClaimed = anesUid && anesUid.trim() !== '';
                const isClaimedByCurrentUser = isClaimed && user && anesUid === user.uid;
                const statusColor = isClaimed ? 'bg-green-500' : 'bg-gray-300';
                
                let buttonHTML = '';
                if (isProviderLoggedIn) {
                    if (isClaimedByCurrentUser) {
                        buttonHTML = `<button data-id="${room.id}" class="unclaim-button mt-1 w-full px-2 py-1 bg-red-600 text-white text-xs font-medium rounded hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-red-500">Unclaim</button>`;
                    } else {
                        buttonHTML = `<button data-id="${room.id}" class="claim-button mt-1 w-full px-2 py-1 bg-green-600 text-white text-xs font-medium rounded hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-green-500">Claim</button>`;
                    }
                }

                let anesDisplay = '<span class="text-gray-400">Available</span>';
                if (isClaimed) {
                    const profile = usersCache[anesUid];
                    if (profile) {
                        const commIcon = commIcons[profile.communicationPreference] || '';
                        anesDisplay = `<div class="flex items-center">${escapeHtml(profile.firstName)} ${escapeHtml(profile.lastName)}${commIcon}</div>`;
                    } else {
                        anesDisplay = 'Unknown User'; // Fallback if profile not found
                    }
                }

                let coveringProviderDisplay = '';
                const coveringUid = room.coveringProvider;
                if (coveringUid && usersCache[coveringUid]) {
                    const coveringProfile = usersCache[coveringUid];
                    coveringProviderDisplay = `
                        <div class="text-xs text-orange-600 font-medium mt-1 pt-1 border-t border-gray-100">
                            Covering: ${escapeHtml(coveringProfile.firstName)} ${escapeHtml(coveringProfile.lastName)}
                        </div>
                    `;
                }

                li.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <span class="font-bold text-sm text-gray-800">${escapeHtml(room.roomName)}</span>
                        <div class="status-dot ${statusColor}" title="${isClaimed ? 'Claimed' : 'Available'}"></div>
                    </div>
                    <div class="space-y-0.5">
                        <div class="editable-input anesthesiologist-input">${anesDisplay}</div>
                        <input
                            type="text"
                            value="${escapeHtml(room.crnaResident || '')}"
                            data-id="${room.id}"
                            data-field="crnaResident"
                            placeholder="CRNA / Resident"
                            class="editable-input crna-resident-input"
                        />
                         ${coveringProviderDisplay}
                    </div>
                    ${buttonHTML}
                `;
                orList.appendChild(li);
                li.querySelectorAll('.editable-input').forEach(input => input.readOnly = !isAdmin);
            });
        }

        function renderActiveAssignments(rooms) {
            const assignments = {};
            rooms.forEach(room => {
                const anesUid = room.anesthesiologist;
                if (anesUid && usersCache[anesUid]) {
                    const profile = usersCache[anesUid];
                    const name = `${profile.firstName} ${profile.lastName}`;
                    assignments[name] = (assignments[name] || 0) + 1;
                }
                // This part for crnaResident remains as is, as they don't have profiles yet
                if (room.crnaResident && room.crnaResident.trim() !== '') {
                    const name = room.crnaResident.trim();
                    assignments[name] = (assignments[name] || 0) + 1;
                }
            });

            activeList.innerHTML = '';
            const sortedNames = Object.keys(assignments).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));

            if (sortedNames.length === 0) {
                activeList.innerHTML = `<p class="text-gray-500 text-xs">No rooms are currently claimed.</p>`;
                return;
            }

            sortedNames.forEach(name => {
                const roomCount = assignments[name];
                const tag = document.createElement('div');
                tag.className = 'fade-in inline-flex items-center bg-blue-100 text-blue-800 text-xs font-semibold px-2 py-1 rounded-full';
                tag.innerHTML = `
                    <span>${escapeHtml(name)}</span>
                    <span class="ml-1.5 bg-blue-200 text-blue-900 text-xs font-bold px-1.5 py-0.5 rounded-full">${roomCount}</span>
                `;
                activeList.appendChild(tag);
            });
        }

        // --- Event Handling ---
        orList.addEventListener('blur', async (event) => {
            const input = event.target;
            if (!isAdmin || !input.classList.contains('editable-input') || !input.dataset.id) return;
            
            const docId = input.dataset.id;
            const field = input.dataset.field;
            const newValue = input.value.trim();
            const docRef = doc(db, `artifacts/${appId}/public/data/or_rooms`, docId);

            try {
                await updateDoc(docRef, { [field]: newValue });
            } catch (error) {
                console.error("Error updating document: ", error);
            }
        }, true);

        orList.addEventListener('click', async (event) => {
            const button = event.target;
            const user = auth.currentUser;

            if (!user || user.isAnonymous || !button.dataset.id) return;

            const docId = button.dataset.id;
            const docRef = doc(db, `artifacts/${appId}/public/data/or_rooms`, docId);

            if (button.classList.contains('claim-button')) {
                try {
                    await updateDoc(docRef, { anesthesiologist: user.uid });
                } catch (error) {
                    console.error("Error claiming room: ", error);
                }
            } else if (button.classList.contains('unclaim-button')) {
                try {
                    await updateDoc(docRef, { anesthesiologist: "" });
                } catch (error) {
                    console.error("Error unclaiming room: ", error);
                }
            }
        });

        async function handleRoleUpdate(event) {
            if (!isAdmin) return;
            const input = event.target;
            const field = input.id === 'charge-input' ? 'charge' : 'float';
            const newValue = input.value.trim();
            const docRef = doc(db, `artifacts/${appId}/public/data/daily_assignments`, 'roles');
            try {
                await updateDoc(docRef, { [field]: newValue });
            } catch (error) {
                console.error("Error updating roles:", error);
            }
        }
        chargeInput.addEventListener('blur', handleRoleUpdate);
        floatInput.addEventListener('blur', handleRoleUpdate);


        // --- UI Mode and Login Logic ---
        function updateUIMode(user) {
            const isProvider = user && !user.isAnonymous;
            
            guestView.classList.toggle('hidden', isProvider || isAdmin);
            loggedInView.classList.toggle('hidden', !isProvider && !isAdmin);
            adminPanelLink.classList.toggle('hidden', !isAdmin);
            profileLink.classList.toggle('hidden', !isProvider);
            
            if (isProvider && currentUserProfile) {
                userDisplay.textContent = `Welcome, ${currentUserProfile.firstName}`;
                userDisplay.classList.remove('hidden');
            } else {
                userDisplay.textContent = '';
                userDisplay.classList.add('hidden');
            }

            document.querySelectorAll('.editable-input').forEach(input => {
                input.readOnly = !isAdmin;
            });
            
            const orRoomsCollectionRef = collection(db, `artifacts/${appId}/public/data/or_rooms`);
            listenForUpdates(orRoomsCollectionRef);
        }

        showAdminLoginButton.addEventListener('click', () => {
            adminLoginModal.classList.remove('hidden');
            passwordInput.value = '';
            adminErrorMessage.textContent = '';
            passwordInput.focus();
        });

        cancelAdminLoginButton.addEventListener('click', () => {
            adminLoginModal.classList.add('hidden');
        });

        adminLoginButton.addEventListener('click', () => {
            if (passwordInput.value === ADMIN_PIN) {
                isAdmin = true;
                sessionStorage.setItem('isAdmin', 'true');
                adminLoginModal.classList.add('hidden');
                updateUIMode(auth.currentUser);
            } else {
                adminErrorMessage.textContent = 'Incorrect PIN. Please try again.';
                passwordInput.value = '';
                passwordInput.focus();
            }
        });

        showAnesLoginButton.addEventListener('click', () => {
            anesLoginModal.classList.remove('hidden');
            anesEmailInput.value = '';
            anesPasswordInput.value = '';
            anesErrorMessage.textContent = '';
            anesEmailInput.focus();
        });

        anesCancelLoginButton.addEventListener('click', () => {
            anesLoginModal.classList.add('hidden');
        });

        anesLoginButton.addEventListener('click', async () => {
            const email = anesEmailInput.value;
            const password = anesPasswordInput.value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                anesLoginModal.classList.add('hidden');
            } catch (error) {
                anesErrorMessage.textContent = 'Login failed: ' + error.message;
            }
        });

        logoutButton.addEventListener('click', async () => {
            if (isAdmin) {
                isAdmin = false;
                sessionStorage.removeItem('isAdmin');
                updateUIMode(auth.currentUser);
            } else {
                try {
                    await signOut(auth);
                    await signInAnonymously(auth);
                } catch (error) {
                    console.error("Sign out error:", error);
                }
            }
        });

        passwordInput.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') adminLoginButton.click();
        });
        
        anesPasswordInput.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') anesLoginButton.click();
        });

        // --- Utility Functions ---
        function escapeHtml(unsafe) {
            if (typeof unsafe !== 'string') return '';
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // --- Initialize App ---
        authenticateUser();
    </script>
</body>
</html>
