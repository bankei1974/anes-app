<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anesthesiologist OR Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        .editable-input {
            background-color: transparent;
            border: 1px solid transparent;
            transition: all 0.2s ease-in-out;
            width: 100%;
            border-radius: 0.375rem; /* rounded-md */
        }
        .editable-input:focus {
            background-color: white;
            border-color: #3b82f6; /* blue-500 */
            outline: none;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4);
        }
        .editable-input[readonly] {
            cursor: not-allowed;
            padding-left: 0;
        }
        .anesthesiologist-input {
            font-size: 0.875rem; /* text-sm */
            font-weight: 600; /* font-semibold */
            color: #1f2937; /* gray-800 */
        }
        .anesthesiologist-input::placeholder { color: #9ca3af; /* gray-400 */ }

        .crna-resident-input {
            font-size: 0.875rem; /* text-sm */
            color: #4b5563; /* gray-600 */
        }
        .crna-resident-input::placeholder { color: #9ca3af; /* gray-400 */ }

        .role-input {
            font-size: 1rem; /* text-base */
            font-weight: 600; /* font-semibold */
        }
        .role-input[readonly] { background-color: transparent; }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }

        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom Tooltip Styles */
        .custom-tooltip {
            position: absolute;
            background-color: #333;
            color: #fff;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            white-space: nowrap;
            z-index: 1000;
            pointer-events: none; /* Allows hovering over elements behind the tooltip */
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }
        .custom-tooltip.show {
            opacity: 1;
        }
    </style>
</head>
<body class="h-full">
    <!-- Anesthesiologist Login Modal -->
    <div id="anesthesiologist-login-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 fade-in">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <h3 class="text-lg leading-6 font-medium text-gray-900">Anesthesiologist Login</h3>
                <div class="mt-2 px-7 py-3 space-y-3">
                    <input type="email" id="anes-email-input" class="w-full px-3 py-2 text-gray-700 border rounded-lg focus:outline-none" placeholder="Email" autocomplete="email" />
                    <input type="password" id="anes-password-input" class="w-full px-3 py-2 text-gray-700 border rounded-lg focus:outline-none" placeholder="Password" autocomplete="current-password" />
                    <p id="anes-error-message" class="text-red-500 text-sm mt-2 h-4"></p>
                </div>
                <div class="items-center px-4 py-3">
                    <button id="anes-login-button" class="px-4 py-2 bg-blue-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-300">
                        Log In
                    </button>
                     <button id="anes-cancel-login-button" class="mt-2 px-4 py-2 bg-gray-200 text-gray-800 text-base font-medium rounded-md w-full shadow-sm hover:bg-gray-300 focus:outline-none">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Handoff Modal -->
    <div id="handoff-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-75 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-6 border w-full max-w-md shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <h3 class="text-lg leading-6 font-medium text-gray-900">Hand Off Assignments</h3>
                <div class="mt-4 space-y-4">
                    <p class="text-sm text-gray-600">You are about to go off duty. Please select another provider to take over all of your current OR assignments.</p>
                    <div>
                        <label for="handoff-provider-select" class="block text-sm font-medium text-gray-700">Select Provider</label>
                        <select id="handoff-provider-select" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md">
                            <!-- Provider options will be populated here -->
                        </select>
                    </div>
                </div>
                <div class="mt-6 flex justify-end space-x-3">
                    <button id="cancel-handoff-button" type="button" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Cancel</button>
                    <button id="confirm-handoff-button" type="button" class="bg-blue-600 py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Confirm Handoff</button>
                </div>
            </div>
        </div>
    </div>

    <div class="flex flex-col h-full bg-gray-50">
        <!-- Header -->
        <header class="bg-white shadow-sm sticky top-0 z-20">
            <div class="max-w-full mx-auto px-4 sm:px-6 lg:px-8 py-2 flex justify-between items-center">
                <div>
                    <h1 class="text-lg font-bold text-gray-800 tracking-tight">Anesthesiology Board</h1>
                </div>
                <div class="flex items-center">
                    <span id="user-display" class="hidden text-sm font-medium text-gray-700 mr-4"></span>
                    <div id="guest-view">
                        <button id="show-anes-login-button" class="px-3 py-1.5 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Provider Login</button>
                    </div>
                    <div id="logged-in-view" class="hidden items-center">
                        <div class="flex items-center mr-4">
                            <span id="status-label" class="text-sm font-medium text-gray-700 mr-2"></span>
                            <button type="button" id="status-toggle" class="relative inline-flex flex-shrink-0 h-6 w-11 border-2 border-transparent rounded-full cursor-pointer transition-colors ease-in-out duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500" role="switch" aria-checked="false">
                                <span class="sr-only">Use setting</span>
                                <span id="status-toggle-knob" aria-hidden="true" class="pointer-events-none inline-block h-5 w-5 rounded-full bg-white shadow transform ring-0 transition ease-in-out duration-200"></span>
                            </button>
                        </div>
                        <a id="profile-link" href="./profile.html" class="hidden text-sm font-medium text-blue-600 hover:text-blue-800 mr-4">My Profile</a>
                        <a id="admin-panel-link" href="./admin.html" class="hidden text-sm font-medium text-blue-600 hover:text-blue-800 mr-4">Admin Panel</a>
                        <button id="logout-button" class="px-3 py-1.5 bg-red-500 text-white text-sm font-medium rounded-md hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">Log Out</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-2 sm:p-3 lg:p-4">
            <div id="loading-indicator" class="flex justify-center items-center h-full">
                <div class="text-center">
                    <div class="loader mx-auto"></div>
                    <p class="mt-2 text-gray-600">Connecting to live board...</p>
                </div>
            </div>

            <div id="app-content" class="hidden max-w-full mx-auto space-y-4">
                <!-- Top Bar Section -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <!-- Daily Assignments -->
                    <div class="bg-white rounded-lg shadow-sm p-3">
                        <h2 class="text-base font-semibold text-gray-700 mb-2">Daily Assignments</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label for="charge-input" class="block text-xs font-medium text-gray-500">Charge</label>
                                <input type="text" id="charge-input" placeholder="Assign..." class="editable-input role-input w-full rounded-md placeholder-gray-400">
                            </div>
                            <div>
                                <label for="helper-input" class="block text-xs font-medium text-gray-500">Helper</label>
                                <input type="text" id="helper-input" placeholder="Assign..." class="editable-input role-input w-full rounded-md placeholder-gray-400">
                            </div>
                            <div>
                                <label for="pca-input" class="block text-xs font-medium text-gray-500">PCA's</label>
                                <input type="text" id="pca-input" placeholder="Assign..." class="editable-input role-input w-full rounded-md placeholder-gray-400">
                            </div>
                            <div class="md:col-span-2">
                                <label for="notes-input" class="block text-xs font-medium text-gray-500">Notes</label>
                                <textarea id="notes-input" placeholder="Add notes..." class="editable-input role-input w-full rounded-md placeholder-gray-400 h-20 resize-y"></textarea>
                            </div>
                        </div>
                    </div>
                    <!-- Active Assignments -->
                    <div class="bg-white rounded-lg shadow-sm p-3">
                        <h2 class="text-base font-semibold text-gray-700 mb-2">Current Assignments</h2>
                        <div id="active-list" class="min-h-[2.5rem] flex flex-wrap gap-2 items-center">
                            <!-- Active list will be populated here -->
                        </div>
                    </div>
                </div>

                <!-- OR Board -->
                <div>
                    <h2 class="text-base font-semibold text-gray-700 mb-2">Operating Rooms</h2>
                    <ul id="or-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-2">
                        <!-- OR items will be dynamically inserted here -->
                    </ul>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, getDocs, getDoc, updateDoc, writeBatch, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Configuration ---
        const firebaseConfig = {
          apiKey: "AIzaSyDN9q5wMyNpIg1Mbil-zSowNwAlrJPIzOg",
          authDomain: "anes-app.firebaseapp.com",
          projectId: "anes-app",
          storageBucket: "anes-app.firebasestorage.app",
          messagingSenderId: "53351553251",
          appId: "1:53351553251:web:956b092846ffa331760dd6",
          measurementId: "G-0PRB28VZ2C"
        };
        const appId = firebaseConfig.appId;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- DOM Elements ---
        const appContent = document.getElementById('app-content');
        const orList = document.getElementById('or-list');
        const loadingIndicator = document.getElementById('loading-indicator');
        const activeList = document.getElementById('active-list');

        const anesLoginModal = document.getElementById('anesthesiologist-login-modal');
        const anesEmailInput = document.getElementById('anes-email-input');
        const anesPasswordInput = document.getElementById('anes-password-input');
        const anesLoginButton = document.getElementById('anes-login-button');
        const anesCancelLoginButton = document.getElementById('anes-cancel-login-button');
        const showAnesLoginButton = document.getElementById('show-anes-login-button');
        const anesErrorMessage = document.getElementById('anes-error-message');

        const userDisplay = document.getElementById('user-display');
        const guestView = document.getElementById('guest-view');
        const loggedInView = document.getElementById('logged-in-view');
        const logoutButton = document.getElementById('logout-button');
        const adminPanelLink = document.getElementById('admin-panel-link');
        const profileLink = document.getElementById('profile-link');

        const chargeInput = document.getElementById('charge-input');
        const helperInput = document.getElementById('helper-input');
        const pcaInput = document.getElementById('pca-input');
        const notesInput = document.getElementById('notes-input');

        const statusLabel = document.getElementById('status-label');
        const statusToggle = document.getElementById('status-toggle');
        const statusToggleKnob = document.getElementById('status-toggle-knob');

        const handoffModal = document.getElementById('handoff-modal');
        const handoffProviderSelect = document.getElementById('handoff-provider-select');
        const cancelHandoffButton = document.getElementById('cancel-handoff-button');
        const confirmHandoffButton = document.getElementById('confirm-handoff-button');

        // --- State ---
        let usersCache = {};
        let currentUserProfile = null;
        let statusCurrentUser = null;
        let statusCurrentUserRef = null;

        // --- Main Application Logic ---
        onAuthStateChanged(auth, async (user) => {
            await loadUserProfiles();

            if (user) {
                currentUserProfile = usersCache[user.uid] || null;
                statusCurrentUserRef = doc(db, 'users', user.uid);
                const userDocSnap = await getDoc(statusCurrentUserRef);

                if (userDocSnap.exists()) {
                    statusCurrentUser = { id: user.uid, ...userDocSnap.data() };
                    renderStatusToggle(statusCurrentUser.status);
                }


                const orRoomsCollectionRef = collection(db, `artifacts/${appId}/public/data/or_rooms`);
                const dailyRolesDocRef = doc(db, `artifacts/${appId}/public/data/daily_assignments`, 'roles');

                await Promise.all([
                    seedInitialData(orRoomsCollectionRef),
                    setupDailyRoles(dailyRolesDocRef)
                ]);

                listenForUpdates(orRoomsCollectionRef);
                listenForRoles(dailyRolesDocRef);
                updateUIMode(user);
            } else {
                currentUserProfile = null;
                updateUIMode(null);
            }
        });

        async function authenticateUser() {
            try {
                if (!auth.currentUser) {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Authentication Error:", error);
                loadingIndicator.innerHTML = '<p class="text-red-500">Authentication failed. Please refresh.</p>';
            }
        }

        async function loadUserProfiles() {
            const usersCollection = collection(db, 'users');
            const snapshot = await getDocs(usersCollection);
            usersCache = {};
            snapshot.forEach(doc => {
                usersCache[doc.id] = doc.data();
            });
        }

        // --- Database Functions (seedInitialData, setupDailyRoles, listenForRoles are unchanged) ---
        async function seedInitialData(collectionRef) {
            const snapshot = await getDocs(collectionRef);
            if (snapshot.empty) {
                console.log("Seeding initial data...");
                const batch = writeBatch(db);
                const defaultRooms = [
                    { roomName: "OR 1", anesthesiologist: "", crnaResident: "", order: 1 },
                    { roomName: "OR 2", anesthesiologist: "", crnaResident: "", order: 2 },
                    { roomName: "OR 3", anesthesiologist: "", crnaResident: "", order: 3 },
                    { roomName: "OR 4", anesthesiologist: "", crnaResident: "", order: 4 },
                    { roomName: "OR 5", anesthesiologist: "", crnaResident: "", order: 5 },
                    { roomName: "OR 6", anesthesiologist: "", crnaResident: "", order: 6 },
                    { roomName: "OR 7", anesthesiologist: "", crnaResident: "", order: 7 },
                    { roomName: "IR", anesthesiologist: "", crnaResident: "", order: 8 },
                    { roomName: "OR 10", anesthesiologist: "", crnaResident: "", order: 9 },
                    { roomName: "OR 11", anesthesiologist: "", crnaResident: "", order: 10 },
                    { roomName: "OR 12", anesthesiologist: "", crnaResident: "", order: 11 },
                    { roomName: "OR 13", anesthesiologist: "", crnaResident: "", order: 12 },
                    { roomName: "OR 14", anesthesiologist: "", crnaResident: "", order: 13 },
                    { roomName: "OR 15", anesthesiologist: "", crnaResident: "", order: 14 },
                    { roomName: "OR 16", anesthesiologist: "", crnaResident: "", order: 15 },
                    { roomName: "OR 17", anesthesiologist: "", crnaResident: "", order: 16 },
                    { roomName: "OR 18", anesthesiologist: "", crnaResident: "", order: 17 },
                    { roomName: "Imaging", anesthesiologist: "", crnaResident: "", order: 18 },
                ];
                defaultRooms.forEach(room => {
                    batch.set(doc(collectionRef), room);
                });
                await batch.commit();
            }
        }

        async function setupDailyRoles(docRef) {
            const docSnap = await getDoc(docRef);
            if (!docSnap.exists()) {
                await setDoc(docRef, { charge: "", helper: "", pca: "", notes: "" });
            }
        }

        function listenForUpdates(collectionRef) {
            onSnapshot(collectionRef, (snapshot) => {
                const rooms = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                rooms.sort((a, b) => a.order - b.order);
                renderORBoard(rooms);
                renderActiveAssignments(rooms);
                loadingIndicator.classList.add('hidden');
                appContent.classList.remove('hidden');
            }, (error) => {
                console.error("Error fetching room data:", error);
                loadingIndicator.innerHTML = '<p class="text-red-500">Error connecting to the live board.</p>';
            });
        }

        function listenForRoles(docRef) {
            onSnapshot(docRef, (doc) => {
                if (doc.exists()) {
                    const roles = doc.data();
                    chargeInput.value = roles.charge || "";
                    helperInput.value = roles.helper || "";
                    pcaInput.value = roles.pca || "";
                    notesInput.value = roles.notes || "";
                }
            }, (error) => {
                console.error("Error fetching roles data:", error);
            });
        }

        // --- UI Rendering ---
        function getContrastYIQ(hexcolor){
            if (hexcolor.startsWith('#')) {
                hexcolor = hexcolor.substring(1);
            }
            var r = parseInt(hexcolor.substr(0,2),16);
            var g = parseInt(hexcolor.substr(2,2),16);
            var b = parseInt(hexcolor.substr(4,2),16);
            var yiq = ((r*299)+(g*587)+(b*114))/1000;
            return (yiq >= 128) ? 'black' : 'white';
        }

        function renderORBoard(rooms) {
            orList.innerHTML = '';
            if (rooms.length === 0) return;

            const user = auth.currentUser;
            const isProviderLoggedIn = user && !user.isAnonymous;
            const isAdmin = currentUserProfile && currentUserProfile.isAdmin === true;

            const commIcons = {
                call: (color, phoneNumber) => `<span class="w-3 h-3 ml-1.5 comm-icon" data-comm-type="call" data-phone-number="${phoneNumber}"><svg style="stroke: ${color};" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg></span>`,
                text: (color, phoneNumber) => `<span class="w-3 h-3 ml-1.5 comm-icon" data-comm-type="text" data-phone-number="${phoneNumber}"><svg style="stroke: ${color};" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg></span>`,
                pager: (color) => `<span class="w-3 h-3 ml-1.5 comm-icon" data-comm-type="pager"><svg title="Pager" style="stroke: ${color};" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 4a2 2 0 012-2h6a2 2 0 012 2v12a2 2 0 01-2 2H7a2 2 0 01-2-2V4zm3 0h4v2H8V4z"></path></svg></span>`,
                'Secure EPIC message': (color) => `<span class="w-3 h-3 ml-1.5 comm-icon" data-comm-type="epic"><svg title="Secure EPIC Message" style="stroke: ${color};" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg></span>`,
                'Vocera': (color) => `<span class="w-3 h-3 ml-1.5 comm-icon" data-comm-type="vocera"><svg title="Vocera" style="stroke: ${color};" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.05 14.25a5.25 5.25 0 10-6.1 0m-6.35-2.9C4.3 9.65 6.45 6 12 6s7.7 3.65 9.4 5.35M3 21h18" /></svg></span>`
            };

            rooms.forEach(room => {
                const li = document.createElement('li');
                const anesUid = room.anesthesiologist;
                const isClaimed = anesUid && anesUid.trim() !== '';
                const profile = isClaimed ? usersCache[anesUid] : null;

                const bgColor = profile && profile.color ? profile.color : '#FFFFFF';
                const textColor = getContrastYIQ(bgColor);

                li.className = 'rounded-lg shadow-sm p-2 flex flex-col justify-between transition hover:shadow-md fade-in';
                li.style.backgroundColor = bgColor;
                li.style.color = textColor;

                const isClaimedByCurrentUser = isClaimed && user && anesUid === user.uid;
                const statusDotColor = isClaimed ? 'bg-green-400' : 'bg-gray-300';

                let buttonHTML = '';
                if (isProviderLoggedIn) {
                    if (isClaimedByCurrentUser) {
                        buttonHTML = `<button data-id="${room.id}" class="unclaim-button mt-1 w-full px-2 py-1 bg-red-600 text-white text-xs font-medium rounded hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-red-500">Unclaim</button>`;
                    } else {
                        buttonHTML = `<button data-id="${room.id}" class="claim-button mt-1 w-full px-2 py-1 bg-green-600 text-white text-xs font-medium rounded hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-green-500">Claim</button>`;
                    }
                }

                let anesDisplay = `<span style="color: ${textColor === 'black' ? '#9ca3af' : '#d1d5db'}">Available</span>`;
                if (isClaimed && profile) {
                    let iconsHTML = '';
                    if (Array.isArray(profile.communicationPreference)) {
                        profile.communicationPreference.forEach(pref => {
                            if (commIcons[pref]) {
                                const phoneNumber = profile.phoneNumber || '';
                                if (pref === 'call' || pref === 'text') {
                                    iconsHTML += commIcons[pref](textColor, phoneNumber);
                                } else {
                                    iconsHTML += commIcons[pref](textColor);
                                }
                            }
                        });
                    }
                    anesDisplay = `<div class="flex items-center">${escapeHtml(profile.firstName)} ${escapeHtml(profile.lastName)}<span class="flex items-center ml-auto">${iconsHTML}</span></div>`;
                } else if (isClaimed) {
                    anesDisplay = 'Unknown User';
                }

                let coveringProviderDisplay = '';
                const coveringUid = room.coveringProvider;
                if (coveringUid && usersCache[coveringUid]) {
                    const coveringProfile = usersCache[coveringUid];
                    coveringProviderDisplay = `
                        <div class="text-xs text-orange-600 font-medium mt-1 pt-1 border-t border-gray-100">
                            Covering: ${escapeHtml(coveringProfile.firstName)} ${escapeHtml(coveringProfile.lastName)}
                        </div>
                    `;
                }

                li.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <span class="font-bold text-sm">${escapeHtml(room.roomName)}</span>
                        <div class="status-dot ${statusDotColor}" title="${isClaimed ? 'Claimed' : 'Available'}"></div>
                    </div>
                    <div class="space-y-0.5">
                        <div class="editable-input anesthesiologist-input" style="color: ${textColor};">${anesDisplay}</div>
                        <input
                            type="text"
                            value="${escapeHtml(room.crnaResident || '')}"
                            data-id="${room.id}"
                            data-field="crnaResident"
                            placeholder="CRNA / Resident"
                            class="editable-input crna-resident-input"
                            style="color: ${textColor};"
                        />
                         ${coveringProviderDisplay}
                    </div>
                    ${buttonHTML}
                `;
                orList.appendChild(li);

                const crnaInput = li.querySelector('.crna-resident-input');
                if (crnaInput) {
                    crnaInput.style.setProperty('--placeholder-color', textColor === 'black' ? '#9ca3af' : '#d1d5db');
                    crnaInput.style.cssText += `
                        --placeholder-opacity: 0.7;
                        color: ${textColor};
                    `;
                    crnaInput.classList.add('placeholder-contrast');
                }

                li.querySelectorAll('.editable-input').forEach(input => input.readOnly = !isAdmin);
            });
        }

        function renderActiveAssignments(rooms) {
            const userAssignments = {};

            rooms.forEach(room => {
                // Aggregate anesthesiologists
                const anesUid = room.anesthesiologist;
                if (anesUid && usersCache[anesUid]) {
                    const profile = usersCache[anesUid];
                    const name = `${profile.firstName} ${profile.lastName}`;
                    if (!userAssignments[name]) {
                        userAssignments[name] = { rooms: [], color: profile.color || '#f3f4f6' };
                    }
                    userAssignments[name].rooms.push(room.roomName);
                }
                // Aggregate CRNAs/Residents
                if (room.crnaResident && room.crnaResident.trim() !== '') {
                    const name = room.crnaResident.trim();
                     if (!userAssignments[name]) {
                        userAssignments[name] = { rooms: [], color: '#f3f4f6' }; // No specific color for CRNAs
                    }
                    userAssignments[name].rooms.push(room.roomName);
                }
            });

            activeList.innerHTML = '';
            const sortedNames = Object.keys(userAssignments).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));

            if (sortedNames.length === 0) {
                activeList.innerHTML = `<p class="text-gray-500 text-xs">No rooms are currently claimed.</p>`;
                return;
            }

            sortedNames.forEach(name => {
                const assignment = userAssignments[name];
                const tag = document.createElement('div');
                tag.className = 'fade-in inline-flex items-center bg-gray-100 text-gray-800 text-xs font-semibold px-2 py-1 rounded-full';
                tag.innerHTML = `
                    <span class="w-2 h-2 rounded-full mr-1.5" style="background-color: ${assignment.color}; border: 1px solid #ccc;"></span>
                    <span>${escapeHtml(name)}</span>
                    <span class="ml-1.5 text-gray-600 text-xs">(${assignment.rooms.sort().join(', ')})</span>
                `;
                activeList.appendChild(tag);
            });
        }

        // --- Event Handling ---
        orList.addEventListener('blur', async (event) => {
            const input = event.target;
            if (!isAdmin || !input.classList.contains('editable-input') || !input.dataset.id) return;

            const docId = input.dataset.id;
            const field = input.dataset.field;
            const newValue = input.value.trim();
            const docRef = doc(db, `artifacts/${appId}/public/data/or_rooms`, docId);

            try {
                await updateDoc(docRef, { [field]: newValue });
            } catch (error) {
                console.error("Error updating document: ", error);
            }
        }, true);

        orList.addEventListener('click', async (event) => {
            const button = event.target;
            const user = auth.currentUser;

            if (!user || user.isAnonymous || !button.dataset.id) return;

            const docId = button.dataset.id;
            const docRef = doc(db, `artifacts/${appId}/public/data/or_rooms`, docId);

            if (button.classList.contains('claim-button')) {
                try {
                    await updateDoc(docRef, { anesthesiologist: user.uid });
                } catch (error) {
                    console.error("Error claiming room: ", error);
                }
            } else if (button.classList.contains('unclaim-button')) {
                try {
                    await updateDoc(docRef, { anesthesiologist: "" });
                } catch (error) {
                    console.error("Error unclaiming room: ", error);
                }
            }
        });

        async function handleRoleUpdate(event) {
            const isAdmin = currentUserProfile && currentUserProfile.isAdmin === true;
            if (!isAdmin) return;
            const input = event.target;
            let field;
            if (input.id === 'charge-input') {
                field = 'charge';
            } else if (input.id === 'helper-input') {
                field = 'helper';
            } else if (input.id === 'pca-input') {
                field = 'pca';
            } else if (input.id === 'notes-input') {
                field = 'notes';
            } else {
                return; // If it's not one of our handled inputs, do nothing
            }
            const newValue = input.value.trim();
            const docRef = doc(db, `artifacts/${appId}/public/data/daily_assignments`, 'roles');
            try {
                await updateDoc(docRef, { [field]: newValue });
            } catch (error) {
                console.error("Error updating roles:", error);
            }
        }
        chargeInput.addEventListener('blur', handleRoleUpdate);
        helperInput.addEventListener('blur', handleRoleUpdate);
        pcaInput.addEventListener('blur', handleRoleUpdate);
        notesInput.addEventListener('blur', handleRoleUpdate);


        // --- UI Mode and Login Logic ---
        function updateUIMode(user) {
            const isProvider = user && !user.isAnonymous;
            const isAdmin = currentUserProfile && currentUserProfile.isAdmin === true;

            guestView.classList.toggle('hidden', isProvider);
            loggedInView.classList.toggle('hidden', !isProvider);
            adminPanelLink.classList.toggle('hidden', !isAdmin);
            profileLink.classList.toggle('hidden', !isProvider);

            if (isProvider && currentUserProfile) {
                const welcomeName = currentUserProfile.firstName || 'User';
                userDisplay.textContent = `Welcome, ${welcomeName}`;
                userDisplay.classList.remove('hidden');
            } else {
                userDisplay.textContent = '';
                userDisplay.classList.add('hidden');
            }

            document.querySelectorAll('.editable-input').forEach(input => {
                input.readOnly = !isAdmin;
            });

            // Re-render board to apply admin-specific UI changes
            const orRoomsCollectionRef = collection(db, `artifacts/${appId}/public/data/or_rooms`);
            listenForUpdates(orRoomsCollectionRef);
        }

        function renderStatusToggle(status) {
            const isOnDuty = status === 'On Duty';
            statusLabel.textContent = status;
            statusToggle.setAttribute('aria-checked', isOnDuty);

            if (isOnDuty) {
                statusToggle.classList.remove('bg-gray-200');
                statusToggle.classList.add('bg-blue-600');
                statusToggleKnob.classList.add('translate-x-5');
            } else {
                statusToggle.classList.remove('bg-blue-600');
                statusToggle.classList.add('bg-gray-200');
                statusToggleKnob.classList.remove('translate-x-5');
            }
        }

        statusToggle.addEventListener('click', async () => {
            const currentStatus = statusToggle.getAttribute('aria-checked') === 'true' ? 'On Duty' : 'Off Duty';
            const newStatus = currentStatus === 'On Duty' ? 'Off Duty' : 'On Duty';

            if (newStatus === 'On Duty') {
                // If switching to On Duty, just update the status
                await updateDoc(statusCurrentUserRef, { status: 'On Duty' });
                renderStatusToggle('On Duty');
            } else {
                // If switching to Off Duty, check for active assignments first
                const orRoomsRef = collection(db, `artifacts/${appId}/public/data/or_rooms`);
                const q = query(orRoomsRef, where("anesthesiologist", "==", statusCurrentUser.id));
                const assignedRoomsSnapshot = await getDocs(q);

                if (assignedRoomsSnapshot.empty) {
                    // No assigned rooms, just update the status
                    await updateDoc(statusCurrentUserRef, { status: 'Off Duty' });
                    renderStatusToggle('Off Duty');
                } else {
                    // Has assigned rooms, show handoff modal
                    await populateHandoffModal();
                    handoffModal.classList.remove('hidden');
                }
            }
        });

        async function populateHandoffModal() {
            handoffProviderSelect.innerHTML = '<option>Loading...</option>';
            const usersRef = collection(db, 'users');
            const q = query(usersRef, where("status", "==", "On Duty"));
            const snapshot = await getDocs(q);

            let optionsHTML = '';
            snapshot.forEach(doc => {
                // Exclude the current user from the list of handoff candidates
                if (doc.id !== statusCurrentUser.id) {
                    const provider = doc.data();
                    optionsHTML += `<option value="${doc.id}">${provider.firstName} ${provider.lastName}</option>`;
                }
            });

            if (optionsHTML) {
                handoffProviderSelect.innerHTML = optionsHTML;
            } else {
                handoffProviderSelect.innerHTML = '<option value="">No available providers</option>';
                confirmHandoffButton.disabled = true;
            }
        }

        cancelHandoffButton.addEventListener('click', () => {
            handoffModal.classList.add('hidden');
            // No status change occurs, so the toggle remains "On Duty"
        });

        confirmHandoffButton.addEventListener('click', async () => {
            const selectedProviderId = handoffProviderSelect.value;
            if (!selectedProviderId) {
                alert("Please select a provider to hand off to.");
                return;
            }

            confirmHandoffButton.disabled = true;
            confirmHandoffButton.textContent = 'Processing...';

            try {
                const batch = writeBatch(db);

                // Find all rooms assigned to the current user
                const orRoomsRef = collection(db, `artifacts/${appId}/public/data/or_rooms`);
                const q = query(orRoomsRef, where("anesthesiologist", "==", statusCurrentUser.id));
                const assignedRoomsSnapshot = await getDocs(q);

                // Reassign each room to the selected provider
                assignedRoomsSnapshot.forEach(roomDoc => {
                    batch.update(roomDoc.ref, { anesthesiologist: selectedProviderId });
                });

                // Update the current user's status to Off Duty
                batch.update(statusCurrentUserRef, { status: 'Off Duty' });

                // Commit the batch
                await batch.commit();

                // Update UI
                renderStatusToggle('Off Duty');
                handoffModal.classList.add('hidden');

            } catch (error) {
                console.error("Handoff failed: ", error);
                alert("An error occurred during the handoff. Please try again.");
            } finally {
                confirmHandoffButton.disabled = false;
                confirmHandoffButton.textContent = 'Confirm Handoff';
            }
        });



        showAnesLoginButton.addEventListener('click', () => {
            anesLoginModal.classList.remove('hidden');
            anesEmailInput.value = '';
            anesPasswordInput.value = '';
            anesErrorMessage.textContent = '';
            anesEmailInput.focus();
        });

        anesCancelLoginButton.addEventListener('click', () => {
            anesLoginModal.classList.add('hidden');
        });

        anesLoginButton.addEventListener('click', async () => {
            const email = anesEmailInput.value;
            const password = anesPasswordInput.value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                anesLoginModal.classList.add('hidden');
            } catch (error) {
                anesErrorMessage.textContent = 'Login failed: ' + error.message;
            }
        });

        logoutButton.addEventListener('click', async () => {
            const isAdmin = currentUserProfile && currentUserProfile.isAdmin === true;
            if (isAdmin) {
                sessionStorage.removeItem('isAdmin');
                updateUIMode(auth.currentUser);
            } else {
                try {
                    await signOut(auth);
                    await signInAnonymously(auth);
                } catch (error) {
                    console.error("Sign out error:", error);
                }
            }
        });

        anesPasswordInput.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') anesLoginButton.click();
        });

        // --- Utility Functions ---
        function escapeHtml(unsafe) {
            if (typeof unsafe !== 'string') return '';
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // --- Custom Tooltip Logic ---
        let currentTooltip = null;

        function showTooltip(targetElement, text) {
            if (!currentTooltip) {
                currentTooltip = document.createElement('div');
                currentTooltip.className = 'custom-tooltip';
                document.body.appendChild(currentTooltip);
            }
            currentTooltip.textContent = text;

            const rect = targetElement.getBoundingClientRect();
            currentTooltip.style.left = `${rect.left + window.scrollX + rect.width / 2}px`;
            currentTooltip.style.top = `${rect.top + window.scrollY - currentTooltip.offsetHeight - 5}px`;
            currentTooltip.classList.add('show');
        }

        function hideTooltip() {
            if (currentTooltip) {
                currentTooltip.classList.remove('show');
            }
        }

        orList.addEventListener('mouseover', (event) => {
            const target = event.target.closest('.comm-icon');
            if (target && target.dataset.phoneNumber && (target.dataset.commType === 'call' || target.dataset.commType === 'text')) {
                const phoneNumber = target.dataset.phoneNumber;
                if (phoneNumber) {
                    showTooltip(target, phoneNumber);
                }
            }
        });

        orList.addEventListener('mouseout', (event) => {
            const target = event.target.closest('.comm-icon');
            if (target) {
                hideTooltip();
            }
        });

        // --- Initialize App ---
        authenticateUser();
    </script>
</body>
</html>
